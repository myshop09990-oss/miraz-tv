<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100912" />
  <meta name="description" content="Miraz TV — বিনামূল্যের ডেমো স্ট্রিমিং অ্যাপ ও ওয়েবসাইট।" />
  <title>Miraz TV — Demo</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <style>
    :root{--bg:#0d0710;--panel:#1b0e1e;--panel2:#211126;--line:#42203c;--accent:#e6449e;--pink:#f252a7;--white:#faf6fb;--muted:#a49aa9;--gold:#f9d644;--font:system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",sans-serif}
    *{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{background:#080509;color:var(--white);font:15px/1.48 var(--font);margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .app{max-width:560px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:calc(82px + env(safe-area-inset-bottom));box-shadow:0 0 0 1px #32182f;position:relative}
    @media(min-width:750px){.app{max-width:1040px}.content{max-width:890px;margin:auto}.episodes{display:grid;grid-template-columns:repeat(2,1fr)}.hero{max-height:430px}.bottom{max-width:1040px!important}}
    .header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #301b32;background:#100912;position:sticky;top:0;z-index:5}.hdr-btn{display:grid;place-items:center;width:41px;height:41px;background:transparent;border:0;border-radius:12px}.hdr-btn:hover{background:#261328}.hdr-right{display:flex;align-items:center;gap:5px}.brand{font-size:25px;letter-spacing:-.9px;font-weight:850;white-space:nowrap}.brand span{color:var(--accent)}.svg-icon{height:24px;width:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.crown{color:#ffd84b;fill:#ffd84b;stroke-width:1.3}
    .content{padding:17px 22px 22px}.searchbox{display:none;gap:9px;align-items:center;margin:0 0 16px;border:1px solid #67315c;border-radius:12px;padding:8px 13px;background:#221124}.searchbox.show{display:flex}.searchbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff}.searchbox input::placeholder{color:#958498}.close-search{background:transparent;border:0;font-size:23px}
    .hero{height:270px;position:relative;overflow:hidden;border-radius:25px;border:1px solid #3d1c34;background:#210b1e;margin-bottom:22px;box-shadow:inset 0 0 0 1px #160714}.hero img{width:100%;height:100%;object-fit:cover;display:block}.hero:after{content:"";position:absolute;inset:48% 0 0;background:linear-gradient(transparent,rgba(13,6,15,.78) 42%,#130b15)}.hero-text{position:absolute;bottom:22px;left:20px;right:20px;z-index:1}.hero-title{font-weight:850;font-size:24px;line-height:1.3;margin-bottom:3px}.hero-sub{font-size:14px;color:#e0d2df}.hero-pill{position:absolute;top:15px;right:15px;z-index:1;background:#140a15bb;border:1px solid #60334f;border-radius:30px;font-size:11px;padding:4px 9px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 16px}.section-title h2{display:flex;align-items:center;gap:12px;font-size:17px;line-height:1.3;letter-spacing:.5px;margin:0;font-weight:850;text-transform:uppercase}.section-title h2:before{content:"";width:7px;height:25px;background:var(--accent);border-radius:8px;display:inline-block}.count{color:var(--pink);font-size:13px;font-weight:700}.small-note{font-size:12px;color:#b7a4b5;margin:0 0 14px}
    .channels{display:flex;gap:18px;overflow-x:auto;padding:0 0 2px;scrollbar-width:none;margin:0 -6px}.channels::-webkit-scrollbar{display:none}.channel{width:92px;min-width:92px;background:transparent;border:0;text-align:center;padding:0}.orb{border:1px solid #331a38;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#1b0d20;font-weight:750;font-size:14px;line-height:1.4;padding:10px;margin:auto auto 8px}.channel.selected .orb{border:3px solid var(--accent);box-shadow:0 0 0 1px #3e1d36}.channel-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c5b9c5;font-size:13px}.channel.selected .channel-label{color:#fff}
    .ad{margin:19px 0 23px;border:1px solid #793264;min-height:84px;border-radius:19px;background:linear-gradient(135deg,#1b0b1c,#160c19);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:12px}.ad p{margin:0;color:#eec3d7;font-size:13px}.ad strong{display:block;color:#facb61;font-size:16px}.ad .ad-tag{font-size:10px;background:#371b30;color:#dfb3cb;padding:3px 6px;border-radius:5px}.ad-label{position:absolute;right:11px;top:5px;color:#aea1aa;font-size:11px}
    .episodes{display:grid;grid-template-columns:1fr;gap:14px}.episode{display:flex;align-items:center;gap:15px;border:1px solid #342039;background:#1a0e1e;padding:13px;border-radius:21px;min-width:0;transition:background .15s}.episode:hover{background:#241229}.thumb{height:91px;width:132px;min-width:132px;border:0;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(138deg,var(--thumb1,#a01467),var(--thumb2,#273767));display:grid;place-items:center}.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 22%,#ffffff55,transparent 18%),linear-gradient(125deg,transparent 30%,#ffffff13 47%,transparent 62%)}.thumb-word{position:absolute;font-size:27px;opacity:.7;filter:drop-shadow(0 4px 5px #0005)}.ep-label{position:absolute;left:7px;top:7px;background:#b33173;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px}.play{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pink);box-shadow:0 7px 20px #0006;font-size:18px;padding-left:3px}.ep-info{flex:1;min-width:0}.ep-title{font-size:15px;font-weight:800;line-height:1.4;margin:0 0 8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.meta{color:#978a9a;font-size:12px}.heart{width:38px;height:38px;border-radius:50%;border:1px solid #4b2b49;background:#27132c;display:grid;place-items:center;flex-shrink:0;color:#e667ae}.heart.on{color:#ff5bab;background:#3a1733}.heart .svg-icon{width:19px;height:19px}.empty{border:1px dashed #513451;border-radius:17px;padding:32px 18px;text-align:center;color:#c6b4c4}.empty b{color:#fff}.empty p{margin:8px 0 0}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;justify-content:space-around;align-items:stretch;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#110b15f5;border-top:1px solid #2f1830;z-index:10;backdrop-filter:blur(16px)}.nav{width:20%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#aaa0af;font-size:12px}.nav-icon{display:grid;place-items:center;width:45px;height:29px;border-radius:18px}.nav-icon .svg-icon{height:21px;width:21px}.nav.selected{color:#fff;font-weight:750}.nav.selected .nav-icon{background:var(--accent);color:white}
    .page-head{margin:7px 0 20px}.page-head h1{font-size:24px;margin:0 0 6px}.page-head p{font-size:13px;color:#b8aabb;margin:0}.tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tv-card{border:1px solid #462340;border-radius:19px;background:#201022;padding:20px 10px;text-align:center;min-height:142px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}.tv-card .tv-symbol{font-size:28px}.tv-card b{font-size:15px}.tv-card span{font-size:11px;color:#c09bb6}.profile-card{padding:20px;border:1px solid #4b2845;background:#201122;border-radius:19px}.profile-card label{display:block;font-weight:750;font-size:13px;margin-bottom:8px}.profile-card input{width:100%;background:#100915;border:1px solid #5e3156;padding:12px;border-radius:10px;color:white}.pink-btn{border:0;border-radius:12px;padding:12px 17px;background:var(--accent);font-weight:800;margin-top:13px}.footnote{margin-top:24px;font-size:12px;line-height:1.7;color:#b4a5b7}
    .overlay{position:fixed;inset:0;background:#060309d9;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{width:min(100%,620px);background:#1d1021;border-radius:18px;padding:16px;border:1px solid #69375a;box-shadow:0 25px 60px #000b}.modal-top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}.modal-top h2{font-size:19px;margin:0}.xbutton{border:0;background:#38203b;border-radius:9px;padding:4px 12px;font-size:21px}.modal video{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;background:#08040a}.modal p{color:#bbaabc;font-size:12px}.drawer-bg{position:fixed;inset:0;background:#000b;z-index:19;display:none}.drawer-bg.show{display:block}.drawer{position:fixed;z-index:20;top:0;bottom:0;left:max(0px,calc((100vw - 1040px)/2));width:min(78vw,320px);background:#1b0f1f;border-right:1px solid #633653;padding:23px;transform:translateX(-120%);transition:transform .23s}.drawer.show{transform:translateX(0)}.drawer h2{color:var(--accent);margin:10px 0 20px}.drawer button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #362038;background:transparent;padding:13px 6px;color:white}.toast{position:fixed;z-index:50;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:#e6479c;padding:10px 17px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="hdr-btn" aria-label="মেনু খুলুন" id="menuBtn"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><span>Miraz</span> TV</div>
    <div class="hdr-right">
      <button class="hdr-btn" aria-label="প্রিমিয়াম ফিচার" id="premiumBtn"><svg class="svg-icon crown" viewBox="0 0 24 24"><path d="M2.8 7.5l4.2 3.7L12 4l5 7.2 4.2-3.7-1.7 11.1h-15z"/><path d="M5 20h14"/></svg></button>
      <button class="hdr-btn" aria-label="সার্চ খুলুন" id="searchBtn"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.4"/><path d="m15.6 15.6 5.1 5.1"/></svg></button>
    </div>
  </header>
  <main class="content">
    <div class="searchbox" id="searchWrap"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.4"/><path d="m15.6 15.6 5.1 5.1"/></svg><input id="searchInput" type="search" placeholder="সিরিয়াল খুঁজুন..." aria-label="সিরিয়াল খুঁজুন"/><button class="close-search" aria-label="সার্চ বন্ধ করুন" id="closeSearch">×</button></div>
    <div id="page"></div>
  </main>
  <nav class="bottom" aria-label="প্রধান নেভিগেশন" id="bottomNav"></nav>
</div>
<div class="drawer-bg" id="drawerBg"></div><aside class="drawer" id="drawer"><button aria-label="মেনু বন্ধ করুন" id="drawerClose">✕ &nbsp; বন্ধ করুন</button><h2>Miraz TV</h2><button data-page="home">🏠 &nbsp; Home</button><button data-page="series">▶ &nbsp; Series</button><button data-page="tv">📺 &nbsp; TV</button><button data-page="favorites">♡ &nbsp; Favorites</button><button data-page="profile">♙ &nbsp; Profile</button></aside>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ভিডিও প্লেয়ার"><div class="modal"><div class="modal-top"><h2 id="modalTitle">নমুনা ভিডিও</h2><button class="xbutton" id="modalClose" aria-label="ভিডিও বন্ধ করুন">×</button></div><video id="player" controls playsinline preload="none"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4"/>আপনার ব্রাউজার ভিডিও চালাতে পারছে না।</video><p>এটি শুধু একটি CC0 লাইসেন্সের নমুনা ভিডিও। প্রকৃত টিভি চ্যানেলের সম্প্রচার এখানে যুক্ত করা হয়নি।</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const sampleVideo='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
const channels=['All','Star Jalsha','Zee Bangla','Colors Bangla','BACHELOR POINT'];
const episodes=[
{id:1,title:'শহরের আলো — আজকের পর্ব (ডেমো)',channel:'Star Jalsha',date:'2026-11-05',ep:6,emoji:'🌆',colors:['#3e2363','#d94e86']},
{id:2,title:'কুসুমের গল্প — নতুন পর্ব (ডেমো)',channel:'Zee Bangla',date:'2026-11-05',ep:5,emoji:'🌸',colors:['#1f5b81','#bc357d']},
{id:3,title:'শেষ বিকেল — বিশেষ পর্ব (ডেমো)',channel:'Colors Bangla',date:'2026-11-04',ep:4,emoji:'🌅',colors:['#b74c43','#43224f']},
{id:4,title:'বন্ধুদের আড্ডা — সিরিজ (ডেমো)',channel:'BACHELOR POINT',date:'2026-11-04',ep:3,emoji:'🎭',colors:['#4b276c','#28758c']},
{id:5,title:'নতুন সকাল — এপিসোড (ডেমো)',channel:'Star Jalsha',date:'2026-11-03',ep:2,emoji:'🌄',colors:['#85532e','#814d85']},
{id:6,title:'বৃষ্টির রাত — পর্ব ১ (ডেমো)',channel:'Zee Bangla',date:'2026-11-03',ep:1,emoji:'🌧️',colors:['#12506a','#8d2d86']}
];
const symbols={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',series:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8"/>',tv:'<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/>',favorites:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.5 8.8-8.5a5.5 5.5 0 0 0 0-7.8z"/>',profile:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>'};
const navNames={home:'Home',series:'Series',tv:'TV',favorites:'Favorites',profile:'Profile'};
const state={page:'home',channel:'All',query:'',favorites:new Set(readJSON('miraztv_favorites',readJSON('banglatv_favorites',[])))};
const pageEl=document.getElementById('page'),navEl=document.getElementById('bottomNav');
function readJSON(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x:fallback}catch{return fallback}}
function icon(name){return `<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">${symbols[name]}</svg>`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visibleEpisodes(){return episodes.filter(e=>((state.page!=='favorites'||state.favorites.has(e.id))&&(state.channel==='All'||e.channel===state.channel)&&(!state.query||`${e.title} ${e.channel}`.toLowerCase().includes(state.query.toLowerCase()))))}
function sectionTitle(title,right=''){return `<div class="section-title"><h2>${title}</h2>${right?`<span class="count">${right}</span>`:''}</div>`}
function channelStrip(){return `<div class="channels" role="group" aria-label="চ্যানেল ফিল্টার">${channels.map(ch=>`<button class="channel ${state.channel===ch?'selected':''}" data-channel="${escapeHTML(ch)}" aria-pressed="${state.channel===ch}"><span class="orb">${escapeHTML(ch)}</span><span class="channel-label">${escapeHTML(ch)}</span></button>`).join('')}</div>`}
function episodeList(){const arr=visibleEpisodes();return `<div class="episodes">${arr.map(e=>`<article class="episode"><button class="thumb" style="--thumb1:${e.colors[0]};--thumb2:${e.colors[1]}" data-play="${e.id}" aria-label="${escapeHTML(e.title)} ভিডিও দেখুন"><span class="thumb-word">${e.emoji}</span><span class="ep-label">EP ${e.ep}</span><span class="play">▶</span></button><div class="ep-info"><h3 class="ep-title">${escapeHTML(e.title)}</h3><div class="meta">▢ ${e.date}</div></div><button class="heart ${state.favorites.has(e.id)?'on':''}" data-fav="${e.id}" aria-label="${state.favorites.has(e.id)?'ফেভারিট থেকে বাদ দিন':'ফেভারিট করুন'}" aria-pressed="${state.favorites.has(e.id)}">${icon('favorites')}</button></article>`).join('')}</div>${arr.length===0?'<div class="empty"><b>কোনো ভিডিও পাওয়া যায়নি</b><p>অন্য চ্যানেল বা সার্চ শব্দ নির্বাচন করুন।</p></div>':''}`}
function home(){return `<div class="hero"><img src="./banner.svg" alt="গোলাপি নিয়ন আলোয় Miraz TV সিনেমা ডেমো ব্যানার"/><span class="hero-pill">DEMO</span><div class="hero-text"><div class="hero-title">Miraz TV Live</div><div class="hero-sub">Watch Premium Shows & Series</div></div></div>${sectionTitle('TV Channels')}${channelStrip()}<p class="small-note" style="margin-top:12px">চ্যানেল নামগুলো শুধু ডেমো ক্যাটাগরি; লাইভ সম্প্রচার নয়।</p><div class="ad"><span class="ad-label">AD</span><div><strong><span class="ad-tag">Ad</span> বিজ্ঞাপনের জায়গা</strong><p>আপনার নিজস্ব বিজ্ঞাপন এখানে দেখানো যাবে</p></div></div>${sectionTitle('Popular Series',`${visibleEpisodes().length} episodes`)}${episodeList()}`}
function series(){return `<div class="page-head"><h1>Popular Series</h1><p>ডেমো সিরিয়াল এবং এপিসোড। সব ভিডিওতে একই CC0 নমুনা ক্লিপ চলে।</p></div>${sectionTitle('TV Channels')}${channelStrip()}${sectionTitle('Episodes',`${visibleEpisodes().length} episodes`)}${episodeList()}`}
function tv(){return `<div class="page-head"><h1>Live TV</h1><p>এখানে এখন কোনো লাইভ চ্যানেল চালু নেই। অনুমোদিত স্ট্রিম পরে যুক্ত করা যাবে।</p></div><div class="tv-grid">${channels.slice(1).map((ch,i)=>`<button class="tv-card" data-tv="${i}"><span class="tv-symbol">${['🎬','📺','🎨','🎭'][i]}</span><b>${escapeHTML(ch)}</b><span>ডেমো ক্যাটাগরি</span></button>`).join('')}</div><div class="footnote">⚠️ কোনো টিভি চ্যানেলের লাইভ ভিডিও, লোগো বা সিরিয়াল প্রচারের জন্য প্রয়োজনীয় স্বত্বাধিকার/লাইসেন্স থাকা জরুরি।</div>`}
function favorites(){return `<div class="page-head"><h1>My Favorites ♡</h1><p>আপনি যে পর্বগুলো পছন্দ করেছেন, এখানে পাবেন। এই তথ্য শুধু এই ব্রাউজারে সংরক্ষিত হয়।</p></div>${sectionTitle('Saved Episodes',`${visibleEpisodes().length} episodes`)}${episodeList()}`}
function profile(){const n=localStorage.getItem('miraztv_name')||localStorage.getItem('banglatv_name')||'';return `<div class="page-head"><h1>My Profile</h1><p>এই পর্যায়ে সার্ভার লগইন নেই। আপনি নিজের মোবাইলে নাম সংরক্ষণ করতে পারবেন।</p></div><div class="profile-card"><label for="profileName">আপনার নাম</label><input id="profileName" autocomplete="name" maxlength="60" placeholder="নাম লিখুন" value="${escapeHTML(n)}"/><button class="pink-btn" id="saveName">Save Name</button></div><div class="footnote">Miraz TV Demo v1.0<br/>এই ওয়েব অ্যাপটি GitHub Pages-এ বিনামূল্যে প্রকাশ করা যায়। প্রকৃত ডাটাবেজ, অনলাইন অ্যাডমিন ও লাইসেন্সকৃত চ্যানেল যুক্ত করতে আলাদা সেটআপ প্রয়োজন।</div>`}
function render(){navEl.innerHTML=Object.keys(navNames).map(n=>`<button class="nav ${state.page===n?'selected':''}" data-page="${n}" aria-current="${state.page===n?'page':'false'}"><span class="nav-icon">${icon(n)}</span><span>${navNames[n]}</span></button>`).join('');const views={home,series,tv,favorites,profile};pageEl.innerHTML=views[state.page]();bindPage()}
function go(page){if(!navNames[page])return;state.page=page;state.channel='All';state.query='';document.getElementById('searchInput').value='';document.getElementById('searchWrap').classList.remove('show');hideDrawer();render();window.scrollTo({top:0,behavior:'instant'})}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2500)}
function openPlayer(id){const e=episodes.find(e=>e.id===Number(id));if(!e)return;document.getElementById('modalTitle').textContent=e.title;const overlay=document.getElementById('overlay');overlay.classList.add('show');document.body.style.overflow='hidden';const player=document.getElementById('player');player.src=sampleVideo;player.load()}
function closePlayer(){const overlay=document.getElementById('overlay');overlay.classList.remove('show');document.body.style.overflow='';const v=document.getElementById('player');v.pause();v.removeAttribute('src');v.load()}
function bindPage(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{state.channel=b.dataset.channel;render()});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.play));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.fav);if(state.favorites.has(id)){state.favorites.delete(id);toast('ফেভারিট থেকে সরানো হয়েছে')}else{state.favorites.add(id);toast('ফেভারিটে যোগ হয়েছে')}localStorage.setItem('miraztv_favorites',JSON.stringify([...state.favorites]));render()});document.querySelectorAll('[data-tv]').forEach(b=>b.onclick=()=>toast('এটি ডেমো: লাইভ স্ট্রিম যুক্ত করা হয়নি'));const save=document.getElementById('saveName');if(save)save.onclick=()=>{const n=document.getElementById('profileName').value.trim();localStorage.setItem('miraztv_name',n);toast('এই ডিভাইসে নাম সংরক্ষিত হয়েছে')}}
function hideDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('drawerBg').classList.remove('show')}
document.getElementById('menuBtn').onclick=()=>{document.getElementById('drawer').classList.add('show');document.getElementById('drawerBg').classList.add('show')};document.getElementById('drawerClose').onclick=hideDrawer;document.getElementById('drawerBg').onclick=hideDrawer;
document.getElementById('searchBtn').onclick=()=>{if(state.page==='tv'||state.page==='profile')go('series');const s=document.getElementById('searchWrap');s.classList.toggle('show');if(s.classList.contains('show'))document.getElementById('searchInput').focus();else{state.query='';document.getElementById('searchInput').value='';render()}};
document.getElementById('closeSearch').onclick=()=>{state.query='';document.getElementById('searchInput').value='';document.getElementById('searchWrap').classList.remove('show');render()};document.getElementById('searchInput').oninput=e=>{state.query=e.target.value.trim();render()};
document.getElementById('premiumBtn').onclick=()=>toast('Premium ফিচার এখনও যুক্ত করা হয়নি');document.getElementById('modalClose').onclick=closePlayer;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closePlayer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePlayer();hideDrawer()}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
</body></html>
